<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies · It Used To Say</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body data-page="movies">
  <div data-partial="navbar"></div>

  <main class="container py-5">
    <p class="kicker mb-2">Index</p>
    <h1 class="mb-4">Movies & Videos</h1>
    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-6">
        <label class="form-label meta small" for="q">Search</label>
        <input class="form-control" id="q" type="search" placeholder="Title or year">
      </div>
      <div class="col-md-3">
        <label class="form-label meta small" for="type">Version type</label>
        <select class="form-select" id="type">
          <option value="">All types</option>
          <option value="tv">TV</option>
          <option value="physical">Physical Media</option>
          <option value="streaming">Streaming</option>
          <option value="rating">Ratings cut</option>
          <option value="regional">Regional</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label meta small" for="medium">Physical media</label>
        <select class="form-select" id="medium">
          <option value="">All media</option>
          <option value="4k">4K UHD</option>
          <option value="bluray">Blu-ray</option>
          <option value="dvd">DVD</option>
          <option value="vhs">VHS</option>
        </select>
      </div>
      <div class="col-md-3 text-md-end">
        <span id="movie-count" class="text-muted-2 meta small"></span>
      </div>
    </div>
    <div class="table-responsive line-card p-2">
      <table class="table table-borderless align-middle mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Year</th>
            <th>Changes</th>
            <th>Types</th>
          </tr>
        </thead>
        <tbody id="movie-rows"></tbody>
      </table>
    </div>
  </main>

  <div data-partial="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
