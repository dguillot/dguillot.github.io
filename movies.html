<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies · It Used To Say</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body data-page="movies">
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top border-bottom border-secondary-subtle">
    <div class="container">
      <a class="navbar-brand" href="index.html">It Used To <span>Say</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" data-nav="movies" href="movies.html">Movies</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="versions" href="versions.html">Version types</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="about" href="about.html">About</a></li>
        </ul>
        <a class="btn btn-sm btn-accent" href="submit.html">Submit a change</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <p class="kicker mb-2">Index</p>
    <h1 class="mb-4">Movies</h1>
    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-6">
        <label class="form-label meta small" for="q">Search</label>
        <input class="form-control" id="q" type="search" placeholder="Title or year">
      </div>
      <div class="col-md-3">
        <label class="form-label meta small" for="type">Version type</label>
        <select class="form-select" id="type">
          <option value="">All types</option>
          <option value="tv">TV</option>
          <option value="airline">Airline</option>
          <option value="streaming">Streaming</option>
          <option value="rating">Ratings cut</option>
          <option value="regional">Regional</option>
        </select>
      </div>
      <div class="col-md-3 text-md-end">
        <span id="movie-count" class="text-muted-2 meta small"></span>
      </div>
    </div>
    <div class="table-responsive line-card p-2">
      <table class="table table-borderless align-middle mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Year</th>
            <th>Changes</th>
            <th>Types</th>
          </tr>
        </thead>
        <tbody id="movie-rows"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer py-4">
    <div class="container small d-flex flex-wrap justify-content-between gap-2">
      <span>It Used To Say · a catalog of replaced and deleted movie lines</span>
      <span>Built with Bootstrap 5.3.8</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
