<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit a change · It Used To Say</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body data-page="submit">
  <div data-partial="navbar"></div>

  <main class="container py-5">
    <p class="kicker mb-2">Contribute</p>
    <h1 class="mb-3">Submit a change</h1>
    <p class="text-muted-2 col-lg-8 mb-4">This starter form opens your email client. Swap the action for Formspree or your own endpoint when you have one.</p>

    <form class="col-lg-8" action="mailto:tips@example.com" method="post" enctype="text/plain">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label" for="movie">Movie or Video</label>
          <input class="form-control" id="movie" name="movie" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="year">Year</label>
          <input class="form-control" id="year" name="year" inputmode="numeric">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="type">Version type</label>
          <select class="form-select" id="type" name="type">
            <option value="tv">TV</option>
            <option value="physical">Physical Media</option>
            <option value="streaming">Streaming</option>
            <option value="rating">Ratings cut</option>
            <option value="regional">Regional</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="medium">Disc / tape</label>
          <select class="form-select" id="medium" name="medium">
            <option value="">Not physical</option>
            <option value="4k">4K UHD</option>
            <option value="bluray">Blu-ray</option>
            <option value="dvd">DVD</option>
            <option value="vhs">VHS</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="action">What happened</label>
          <select class="form-select" id="action" name="action">
            <option value="replaced">Replaced</option>
            <option value="deleted">Deleted</option>
            <option value="muted">Muted</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="original">Original line</label>
          <textarea class="form-control" id="original" name="original" rows="2" required></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="replacement">Replacement (leave blank if deleted or muted)</label>
          <textarea class="form-control" id="replacement" name="replacement" rows="2"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="edition">Edition (label, year, region)</label>
          <input class="form-control" id="edition" name="edition" placeholder="Arrow Video UK 4K, 2024">
        </div>
        <div class="col-12">
          <label class="form-label" for="source">Where you heard it</label>
          <input class="form-control" id="source" name="source" placeholder="TBS, Delta, Disney+ U.S., 2024…">
        </div>
        <div class="col-12">
          <button class="btn btn-accent" type="submit">Send</button>
        </div>
      </div>
    </form>
  </main>

  <div data-partial="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
